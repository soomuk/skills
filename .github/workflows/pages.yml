# skills.json을 고치면 index.html을 다시 만들어 GitHub Pages에 올린다.
name: 스킬 서가 페이지 만들기

on:
  push:
    branches: [main]
    paths:
      - "skills.json"
      - "build.py"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 글꼴과 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install --quiet fonttools brotli

      - name: index.html 만들기
        run: python3 build.py

      - name: 저장소의 index.html도 최신으로 맞추기
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "index.html 자동 갱신"
            git push
          fi

      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
